name: 02-Build Vector Release

on:
  workflow_dispatch:      # Manual trigger for building vector release

concurrency:
  group: icd11-vector-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build LanceDB vector database
        run: |
          python scripts/build_vectors.py --data-dir data

      - name: Zip LanceDB store
        run: |
          cd data
          zip -r icd11_vectors.zip lancedb_store/
          mv icd11_vectors.zip ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: icd11_vectors.zip
          tag_name: vector-db-${{ github.run_number }}
          name: "ICD-11 Vector DB ${{ github.run_number }}"
          body: |
            Automated ICD-11 vector database build.
            
            Contains LanceDB embeddings for all ICD-11 entities.
            Model: intfloat/multilingual-e5-large
          generate_release_notes: false
          draft: false
          prerelease: false
