name: 01-Data Sync

on:
  schedule:
    # Every 2 hours to allow sufficient time for batch processing (~2500 nodes per run)
    # At ~85k nodes total, this completes in approximately 6-8 hours of cumulative compute time
    - cron: '0 */2 * * *'
  workflow_dispatch:      # Manual trigger with --force
    inputs:
      force_full_sync:
        description: 'Force full re-sync (clears database first)'
        required: false
        default: 'false'

concurrency:
  group: icd11-data-sync
  cancel-in-progress: false  # Do not interrupt running sync processes

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Allow up to 2 hours for batch processing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Force clear database (if requested)
        if: github.event.inputs.force_full_sync == 'true'
        run: |
          rm -f data/db/sync_state.db
          echo "Database cleared for full re-sync"

      - name: Run WHO ICD-11 async sync (processes batch of 2500 nodes)
        env:
          ICD_CLIENT_ID: ${{ secrets.ICD_CLIENT_ID }}
          ICD_CLIENT_SECRET: ${{ secrets.ICD_CLIENT_SECRET }}
        run: |
          python src/fetchers/who_client.py --data-dir data
        continue-on-error: false  # Fail the job if sync script fails unexpectedly

      - name: Commit and push SQLite state
        uses: stefanzweifel/git-auto-commit-action@v5
        if: always()  # Always try to commit even if previous steps had issues
        with:
          commit_message: "chore: auto-commit sync_state.db after WHO ICD-11 batch sync"
          file_pattern: "data/db/sync_state.db"
          branch: ${{ github.ref_name }}
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
