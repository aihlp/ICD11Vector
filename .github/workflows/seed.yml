name: Weekly ICD-11 Data Sync

on:
  schedule:
    # Weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:      # Manual trigger with --force

concurrency:
  group: antigravity-data
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ICD-11 sync
        env:
          ICD_CLIENT_ID: ${{ secrets.ICD_CLIENT_ID }}
          ICD_CLIENT_SECRET: ${{ secrets.ICD_CLIENT_SECRET }}
        run: |
          # Use --force for manual triggers to ensure full sync
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/fetch_icd11.py --data-dir data $FORCE_FLAG

      - name: Check for changes
        id: git-check
        run: |
          if git diff --exit-code; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: daily ICD-11 data sync"
          branch: chore/daily-icd11-sync
          title: "chore: daily ICD-11 data sync"
          body: |
            Automated daily sync of ICD-11 data from WHO API.

            This PR was created automatically by the daily sync workflow.
          labels: automated-pr
