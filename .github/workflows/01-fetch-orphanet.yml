name: 01-fetch-orphanet

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  fetch-orphanet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run Orphanet fetcher
        run: |
          python -m src.fetchers.orphanet_client
      
      - name: Commit updated state database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Orphanet data in state db"
          file_pattern: "data/sync_state.db"
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
