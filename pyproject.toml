[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icd11-kb"
version = "0.1.0"
description = "Structured and vector-ready ICD-11 knowledge base"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
  "pyyaml>=6.0.1",
  "pydantic>=2.7",
  "requests>=2.32",
  "typer>=0.12",
  "rich>=13.7",
  "lancedb>=0.10",
  "pyarrow>=15.0",
  "fastembed>=0.3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.22"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
